# Render Blueprint: free PostgreSQL + API + Streamlit frontend.
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo.
databases:
  - name: health-tracker-db
    plan: free
    databaseName: healthtracker
    user: healthtracker

services:
  - type: web
    name: health-tracker-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: health-tracker-db
          property: connectionString
      - key: API_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://health-tracker-frontend.onrender.com
      - key: GROQ_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false

  - type: web
    name: health-tracker-frontend
    runtime: python
    plan: free
    rootDir: frontend
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run streamlit_app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true --browser.gatherUsageStats false
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      # Public URL of the API service above (Render free services cannot receive private-network traffic).
      # Change it if Render assigns your API a different subdomain.
      - key: API_URL
        value: https://health-tracker-api.onrender.com
      - key: API_KEY
        fromService:
          name: health-tracker-api
          type: web
          envVarKey: API_KEY
